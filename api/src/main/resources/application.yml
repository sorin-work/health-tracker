spring:
  application:
    name: health-tracker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5435/health}
    username: ${DATABASE_USER:health}
    password: ${DATABASE_PASSWORD:health}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # Must be at least 32 bytes. Override with JWT_SECRET outside local development.
    secret: ${JWT_SECRET:local-development-secret-change-me-0123456789}
    ttl: ${JWT_TTL:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed-demo: ${SEED_DEMO:false}
