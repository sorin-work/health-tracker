name: health-tracker

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health}
      POSTGRES_DB: ${POSTGRES_DB:-health}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5435}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-health}
      DATABASE_USER: ${POSTGRES_USER:-health}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-health}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-0123456789}
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5176}
      # Creates demo@example.com / demo-password with a year of sample data.
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${API_PORT:-4300}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/actuator/health/readiness || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-5176}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
